[project]
name = "smirk"
requires-python = ">=3.9"
dynamic = ["version", "readme", "license"]
authors = [
    { name="Alexius Wadell", email="awadell@umich.edu" },
    { name="Anoushka Bhutani" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "transformers >=4.40,<5",
]

[project.urls]
source = "https://github.com/BattModels/smirk"
homepage = "https://eeg.engin.umich.edu/smirk"
documentation = "https://eeg.engin.umich.edu/smirk"
issues = "https://github.com/BattModels/smirk/issues"
changelog = "https://github.com/BattModels/smirk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "parameterized==0.9.0",
    "ruff~=0.9.4",
    "torch~=2.0",
    "numpy~=2.0",
    "pre-commit>=4.1,<4.7",
    "maturin~=1.7",
]
docs = [
    "furo==2025.12.19",
    "jupyter~=1.1",
    "myst-nb>=1.2,<1.4",
    "sphinx>=7.4,<9.0",
    "sphinx-argparse==0.4.0; python_version < '3.10'",
    "sphinx-argparse==0.6.0; python_version >= '3.10'",
    "sphinx-autobuild==2024.10.3",
    "sphinx-copybutton==0.5.2",
    "accelerate~=1.3",
    "datasets>=3.3,<6.0",
    "torch~=2.0",
    "rdkit==2026.3.3",
    "transformers>=4.48.2,<4.58.0",
    "truststore>=0.10.4; python_version >= '3.10'",
]

[build-system]
build-backend = "maturin"
requires = ["maturin~=1.7"]

[tool.maturin]
python-source = "python"
include = [ "python/smirk/vocab_smiles.json", "python/smirk/vocab_bigsmiles.json", "python/smirk/vocab_selfies.json" ]
